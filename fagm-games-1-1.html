<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAGM</title>
<style>
  :root{
    --green: #188038;
    --text-main: #1f1f1f;
    --text-sub: #5f6368;
    --divider: #e8eaed;
    --bg: #ffffff;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html, body{ height:100%; }
  body{
    background: var(--bg);
    color: var(--text-main);
    font-family: 'Google Sans', Roboto, Arial, sans-serif;
    min-height: 100vh;
  }

  /* Top bar */
  .topbar{
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--divider);
  }
  .topbar .icon-btn{
    width: 24px; height: 24px;
    display:flex; align-items:center; justify-content:center;
    color: #5f6368;
    font-size: 19px;
    cursor: pointer;
    background:none; border:none;
  }
  .topbar .title{
    display:flex;
    align-items:baseline;
    gap: 8px;
    font-size: 20px;
    font-weight: 500;
  }
  .topbar .title .brand{
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .topbar .title .sub-word{
    font-size: 14px;
    color: var(--text-sub);
    font-weight: 400;
  }

  /* Search pill */
  .search-wrap{
    padding: 12px 16px 4px;
  }
  .search-box{
    display:flex;
    align-items:center;
    gap: 10px;
    background: #f1f3f4;
    border-radius: 24px;
    padding: 10px 16px;
  }
  .search-box .icon{ color: #5f6368; font-size: 16px; }
  .search-box input{
    flex:1;
    background: transparent;
    border:none;
    outline:none;
    font-size: 15px;
    font-family: inherit;
    color: var(--text-main);
  }
  .search-box input::placeholder{ color: #80868b; }

  /* Section heading */
  .section-heading{
    padding: 22px 16px 4px;
  }
  .section-heading h2{
    font-size: 22px;
    font-weight: 400;
  }
  .section-heading .desc{
    color: var(--text-sub);
    font-size: 14px;
    margin-top: 6px;
  }

  .no-results{
    display:none;
    text-align:center;
    color: var(--text-sub);
    padding: 50px 20px;
    font-size: 14px;
  }
  .no-results.show{ display:block; }

  /* List */
  .list{ padding-bottom: 30px; }

  .row{
    display:flex;
    align-items:center;
    gap: 16px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--divider);
    cursor: pointer;
    background: none;
    border-right: none; border-left: none; border-top: none;
    width: 100%;
    text-align: right;
    font-family: inherit;
  }
  .row:active{ background: #f5f5f5; }

  .play-btn{
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 2px solid var(--green);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink: 0;
    color: var(--green);
    font-size: 13px;
  }
  .play-btn::before{
    content: "";
    width: 0; height: 0;
    border-style: solid;
    border-width: 6px 0 6px 9px;
    border-color: transparent transparent transparent var(--green);
    margin-right: -2px;
  }

  .row-text{
    flex: 1;
    min-width: 0;
  }
  .row-text .name{
    font-size: 16px;
    font-weight: 500;
    color: var(--text-main);
  }
  .row-text .sub{
    font-size: 13px;
    color: var(--text-sub);
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .fuzzy-tag{
    background: #fef7e0;
    color: #b06000;
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 4px;
  }

  .icon-tile{
    width: 56px; height: 56px;
    border-radius: 14px;
    flex-shrink: 0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 30px;
    border: 1px solid var(--divider);
  }

  /* Full-screen game view */
  .game-view{
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    flex-direction: column;
    z-index: 200;
  }
  .game-view.open{ display:flex; }

  .side-tab{
    position: absolute;
    top: 50%;
    left: 0;
    transform: translateY(-50%);
    z-index: 215;
    background: rgba(255,255,255,0.92);
    border: none;
    border-radius: 0 10px 10px 0;
    width: 26px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: var(--text-main);
    cursor: pointer;
    box-shadow: 2px 0 8px rgba(0,0,0,0.25);
  }

  .sidebar-backdrop{
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 209;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .sidebar-backdrop.show{
    opacity: 1;
    pointer-events: auto;
  }

  .sidebar{
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 210px;
    max-width: 70vw;
    z-index: 210;
    background: #ffffff;
    transform: translateX(-100%);
    transition: transform .22s ease;
    box-shadow: 2px 0 16px rgba(0,0,0,0.3);
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .sidebar.open{ transform: translateX(0); }

  .sidebar-item{
    background: #f1f3f4;
    border: none;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 500;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    text-align: right;
  }
  .sidebar-item:active{ background: #e4e7e8; }

  .game-view iframe{
    width: 100%;
    height: 100%;
    border: none;
    background: #fff;
  }

  .load-msg{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size: 14px;
    letter-spacing: 1px;
    pointer-events: none;
  }
</style>
</head>

function normalize(str){
  if(!str) return "";
  return str
    .toLowerCase()
    .replace(/[\u064B-\u065F\u0670]/g, "")
    .replace(/[إأآا]/g, "ا")
    .replace(/ى/g, "ي")
    .replace(/ة/g, "ه")
    .replace(/ؤ/g, "و")
    .replace(/ئ/g, "ي")
    .replace(/ـ/g, "")
    .replace(/[^\u0600-\u06FFa-z0-9 ]/g, "")
    .trim();
}

function trigrams(str){
  const s = " " + str + " ";
  const grams = new Set();
  for(let i=0;i<s.length-2;i++) grams.add(s.slice(i,i+3));
  return grams;
}

function similarity(a, b){
  if(!a || !b) return 0;
  const ga = trigrams(a), gb = trigrams(b);
  let overlap = 0;
  ga.forEach(g => { if(gb.has(g)) overlap++; });
  const denom = Math.max(ga.size, gb.size) || 1;
  return overlap / denom;
}

const list = document.getElementById("list");
const noResults = document.getElementById("noResults");
const searchInput = document.getElementById("searchInput");
const searchToggle = document.getElementById("searchToggle");
const gameView = document.getElementById("gameView");
const gameIframe = document.getElementById("gameIframe");
const backBtn = document.getElementById("backBtn");
const loadMsg = document.getElementById("loadMsg");
const sideTab = document.getElementById("sideTab");
const sidebar = document.getElementById("sidebar");
const sidebarBackdrop = document.getElementById("sidebarBackdrop");

function render(items){
  list.innerHTML = "";
  items.forEach(({game, fuzzy}) => {
    const row = document.createElement("button");
    row.className = "row";
    row.innerHTML = `
      <span class="play-btn"></span>
      <span class="row-text">
        <div class="name">${game.name}</div>
        <div class="sub">${fuzzy ? '<span class="fuzzy-tag">أقرب نتيجة</span>' : 'اللعبة مضمّنة في مكتبتك'}</div>
      </span>
      <span class="icon-tile">${game.icon}</span>
    `;
    row.addEventListener("click", () => openGame(game));
    list.appendChild(row);
  });
}

function search(query){
  const q = normalize(query);
  if(!q){
    render(GAMES.map(g => ({game: g, fuzzy:false})));
    noResults.classList.remove("show");
    return;
  }

  const exact = [];
  const fuzzy = [];

  GAMES.forEach(game => {
    const nameNorm = normalize(game.name);
    const kwNorm = game.keywords.map(normalize);
    const fields = [nameNorm, ...kwNorm];

    const isDirectMatch = fields.some(f => f.includes(q) || q.includes(f));
    if(isDirectMatch){
      exact.push(game);
      return;
    }

    let best = 0;
    fields.forEach(f => { best = Math.max(best, similarity(q, f)); });
    if(best >= 0.28){
      fuzzy.push({game, score: best});
    }
  });

  fuzzy.sort((a,b) => b.score - a.score);

  const results = [
    ...exact.map(g => ({game:g, fuzzy:false})),
    ...fuzzy.map(f => ({game:f.game, fuzzy:true}))
  ];

  if(results.length === 0){
    list.innerHTML = "";
    noResults.classList.add("show");
  } else {
    noResults.classList.remove("show");
    render(results);
  }
}

function b64ToUtf8(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}

function openGame(game){
  loadMsg.style.display = "flex";
  gameIframe.removeAttribute("src");
  gameIframe.srcdoc = "";
  gameView.classList.add("open");
  document.body.style.overflow = "hidden";
  // Force a synchronous layout flush so the iframe has its real,
  // final size BEFORE the game's own script runs and measures
  // window.innerWidth/innerHeight to size its canvas.
  void gameView.offsetHeight;
  gameIframe.srcdoc = b64ToUtf8(game.data);
}

gameIframe.addEventListener("load", () => {
  loadMsg.style.display = "none";
  try{
    gameIframe.contentWindow.dispatchEvent(new Event("resize"));
  }catch(e){ /* cross-origin edge case, ignore */ }
});

function closeSidebar(){
  sidebar.classList.remove("open");
  sidebarBackdrop.classList.remove("show");
}

function closeGame(){
  gameView.classList.remove("open");
  gameIframe.srcdoc = "";
  document.body.style.overflow = "";
  closeSidebar();
}

sideTab.addEventListener("click", () => {
  sidebar.classList.add("open");
  sidebarBackdrop.classList.add("show");
});
sidebarBackdrop.addEventListener("click", closeSidebar);
backBtn.addEventListener("click", closeGame);

searchToggle.addEventListener("click", () => searchInput.focus());
searchInput.addEventListener("input", e => search(e.target.value));

render(GAMES.map(g => ({game: g, fuzzy:false})));
</script>
